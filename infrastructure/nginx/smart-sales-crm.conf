# Reverse proxy for Smart Sales CRM (TLS termination, WebSockets for Socket.IO).
# Replace crm.example.com and provide fullchain.pem / privkey.pem in the certs directory
# (e.g. from Let's Encrypt certbot). Set TRUST_PROXY=1 in the app's .env when using this proxy.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream sscrm_app { server app:3000; keepalive 32; }

server {
  listen 80;
  server_name crm.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name crm.example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # Uploads: message attachments up to MEDIA_MAX_BYTES (10 MB default) + multipart overhead.
  client_max_body_size 12m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location /socket.io/ {
    proxy_pass http://sscrm_app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://sscrm_app;
    proxy_read_timeout 60s;
  }
}
